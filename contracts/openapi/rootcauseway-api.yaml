        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEvidence'

  /incidents/{id}/approve-stage:
    post:
      tags: [Incidents]
      summary: Approve the pipeline stage an incident is currently paused on (HITL gate)
      description: >
        When an organization has pipeline_hitl_gate_enabled set, the orchestrator
        pauses before running the postmortem stage and marks the incident's
        awaiting_approval_stage. This endpoint lets an authenticated human approve
        that stage, clearing awaiting_approval_stage and recording approved_by /
        approved_at. On success, a pipeline.stage_approved event is published so
        the agent-service can resume the run (see contracts/events/redis-events.yaml).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stage approved; resume event published
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_id:
                    type: string
                    format: uuid
                  stage:
                    type: string
                    example: postmortem
                  approved_by:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: approved
        '401':
          description: Authentication required
        '409':
          description: Incident is not currently awaiting approval

