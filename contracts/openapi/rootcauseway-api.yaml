      summary: Export postmortem as Markdown or PDF
      description: |
        Renders the incident's postmortem (executive summary, timeline, root
        cause, impact, lessons learned, what-went-well/wrong, action items,
        prevention measures) as a downloadable document, for sharing outside
        the platform (Confluence/Notion/email). Both formats are generated
        from the same underlying postmortem data and differ only in
        rendering.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: >
            Output format. Defaults to `markdown` when omitted. A value
            other than `markdown`/`pdf` returns 400.
          schema:
            type: string
            enum: [markdown, pdf]
            default: markdown
      responses:
        '200':
          description: >
            OK. `Content-Type` is `text/markdown` or `application/pdf`
            depending on `format`; `Content-Disposition` is set to
            `attachment; filename="postmortem-{incident-id}.{md|pdf}"`.
          content:
            text/markdown:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid incident id, or unrecognized `format` value
        '404':
          description: Postmortem not found for this incident

