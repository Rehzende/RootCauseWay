  # --- WebSocket ---
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket connection for real-time events
      description: |
        Upgrades to a WebSocket connection for real-time event streaming.
        Authentication is via JWT token passed as a query parameter.

        **Client messages (JSON):**
        - `{"action": "subscribe", "topics": ["incident:<uuid>"]}`  - Subscribe to specific incident updates
        - `{"action": "unsubscribe", "topics": ["incident:<uuid>"]}` - Unsubscribe from topics
        - `{"action": "ping"}` - Heartbeat, responds with `{"type": "pong"}`

        **Server events (JSON):**
        - `incident.created` - New incident created
        - `incident.updated` - Incident updated
        - `agent.status` - Agent execution status change
        - `rca.completed` - Root cause analysis completed
        - `postmortem.generated` - Postmortem generated
        - `feedback.received` - Feedback submitted

        Each event has: `type`, `incident_id`, `data`, `timestamp`
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: JWT authentication token
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '401':
          description: Unauthorized - invalid or missing token

  # --- Organization Settings ---
  /organizations/{id}/settings:
    get:
      tags: [Organizations]
      summary: Get organization-level pipeline settings
      description: >
        Public, JWT-authenticated counterpart to the internal settings
        lookup used by agent-service. Lets the frontend load the current
        pipeline_hitl_gate_enabled value (e.g. on Settings page mount).
        Callers may only read their own organization.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id:
                    type: string
                    format: uuid
                  pipeline_hitl_gate_enabled:
                    type: boolean
        '403':
          description: Cannot read another organization's settings
        '404':
          description: Organization not found
    patch:
      tags: [Organizations]
      summary: Update organization-level pipeline settings
      description: >
        Currently supports toggling pipeline_hitl_gate_enabled, which gates
        the postmortem stage behind human approval (see
        /incidents/{id}/approve-stage). Callers may only update their own
        organization (enforced from the authenticated org context).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pipeline_hitl_gate_enabled:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id:
                    type: string
                    format: uuid
                  pipeline_hitl_gate_enabled:
                    type: boolean
        '403':
          description: Cannot modify another organization's settings
        '404':
          description: Organization not found

  # --- War Room ---
  # Microsoft Teams meetings spun up from an incident, with post-meeting
  # transcript/attendance capture and LLM summarization. See
  # backend/internal/integrations/teams for provider selection (real Graph
  # API vs MockTeamsClient vs NoopTeamsClient) and
  # contracts/events/redis-events.yaml for warroom.meeting.ended.
  /incidents/{id}/warroom:
    post:
      tags: [War Room]
      summary: Create a Teams meeting ("war room") for an incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
        '502':
          description: Teams provider not configured or the create-meeting call failed
    get:
      tags: [War Room]
      summary: Get the current war room meeting for an incident (status, join URL, summary once available)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: No war room meeting found for this incident

  /warroom/{meetingId}/end:
    post:
      tags: [War Room]
      summary: Mark a war room meeting ended; fetch transcript + attendance from Teams; publish warroom.meeting.ended
      description: >
        v1 limitation: manual trigger only. There is no real Graph
        subscription webhook receiver available without an Azure AD tenant
        in this environment, so meeting-end detection is triggered by the
        on-call user calling this endpoint (e.g. from the frontend "end war
        room" button) instead of a Graph change notification. The handler
        delegates to the same WarRoomService.EndWarRoom method a future
        webhook receiver would call.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Meeting not found

  /internal/warroom/{meetingId}:
    get:
      tags: [War Room]
      summary: (internal) Fetch a war room meeting by ID, including raw_transcript
      description: Used by agent-service to fetch the transcript after warroom.meeting.ended before summarizing.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: Meeting not found

  /internal/warroom/{meetingId}/summary:
    patch:
      tags: [War Room]
      summary: (internal) Write back the LLM-generated summary + participant list
      description: Called by agent-service once it has summarized the transcript. Sets status to "summarized".
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: object
                  required: [executive_summary]
                  properties:
                    executive_summary:
                      type: string
                    key_points:
                      type: array
                      items:
                        type: string
                    action_items:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          owner_hint:
                            type: string
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      join_time:
                        type: string
                        format: date-time
                      leave_time:
                        type: string
                        format: date-time
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request body
        '404':
          description: Meeting not found

  # --- Data Retention & Archival ---
  # v1 scope: there is no built-in scheduler in this environment. The sweep
  # endpoint below is the mechanism for both manual, on-demand runs and (via
  # an external cron, or a future in-process ticker) scheduled runs -- the
  # underlying service logic (RunRetentionSweep) is schedule-agnostic.
  /retention-policies:
    get:
      tags: [Retention]
      summary: List retention policies for the caller's organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/RetentionPolicy'
    post:
      tags: [Retention]
      summary: Create a retention policy for a resource type
      description: >
        At most one policy per (org, resource_type) -- creating a second
        policy for a resource_type that already has one fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetentionPolicyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '400':
          description: Invalid request body

  /retention-policies/{id}:
    put:
      tags: [Retention]
      summary: Update a retention policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetentionPolicyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '403':
          description: Policy belongs to another organization
        '404':
          description: Policy not found
    delete:
      tags: [Retention]
      summary: Delete a retention policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Policy belongs to another organization
        '404':
          description: Policy not found

  /retention-policies/sweep:
    post:
      tags: [Retention]
      summary: Manually trigger a retention sweep for the caller's organization
      description: >
        Loads the caller's enabled retention policies and, per policy, finds
        expired records (evidence collected_at, or resolved/closed incidents'
        resolved_at, or agent_runs created_at, older than retention_days) and
        either archives them (snapshot to archived_records, then delete) or
        hard-deletes them, depending on the policy's action.

        v1 scope: this manual trigger is the only way to run a sweep in this
        environment -- there is no cron/ticker wired up. It exists so that
        when scheduling infra is added later (an in-process ticker in
        main.go, or an external cron), it can call the same underlying
        service method (RunRetentionSweep) that backs this endpoint, or hit
        this endpoint directly, without any service-layer changes.
      responses:
        '200':
          description: Sweep completed (individual record failures are reported per-policy, not as a 5xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSweepSummary'
