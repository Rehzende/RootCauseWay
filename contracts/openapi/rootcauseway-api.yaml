openapi: 3.1.0
info:
  title: RootCauseway - Root Cause Analysis Intelligence
  version: 0.1.0
  description: Platform API for incident investigation and root cause analysis

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    # --- Organization ---
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        pipeline_hitl_gate_enabled:
          type: boolean
          description: >
            When true, the orchestrator pauses the pipeline before the
            postmortem stage and waits for a human to POST
            /incidents/{id}/approve-stage instead of auto-generating it.
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # --- User ---
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, operator, viewer]
        created_at:
          type: string
          format: date-time

    # --- Software Catalog ---
    SoftwareEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        owner_id:
          type: string
          format: uuid
        repository_url:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, deprecated, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSoftwareRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        description:
          type: string
        owner_id:
          type: string
          format: uuid
        repository_url:
          type: string
        tags:
          type: array
          items:
            type: string

    # --- Agent Registry ---
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [triage, evidence_analysis, hypothesis, debug, custom]
        description:
          type: string
        config:
          type: object
          description: Agent-specific configuration (LLM model, tools, prompts)
          properties:
            model:
              type: string
            temperature:
              type: number
            tools:
              type: array
              items:
                type: string
            system_prompt:
              type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAgentRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [triage, evidence_analysis, hypothesis, debug, custom]
        description:
          type: string
        config:
          type: object
          properties:
            model:
              type: string
            temperature:
              type: number
            tools:
              type: array
              items:
                type: string
            system_prompt:
              type: string

    # --- Webhook ---
    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
          enum: [datadog, prometheus_alertmanager, grafana, otel, custom]
        software_id:
          type: string
          format: uuid
          description: Links webhook to a software catalog entry
        endpoint_token:
          type: string
          description: Unique token used in the webhook URL path
        secret:
          type: string
          description: Shared secret for signature validation
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [name, source, software_id]
      properties:
        name:
          type: string
        source:
          type: string
          enum: [datadog, prometheus_alertmanager, grafana, otel, custom]
        software_id:
          type: string
          format: uuid

    # --- Incident ---
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        software_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [open, investigating, mitigated, resolved, closed]
        assignee_id:
          type: string
          format: uuid
        source_alert_id:
          type: string
        root_cause:
          type: string
        mitigation:
          type: string
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEvent'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEvidence'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    IncidentEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [alert_received, triage_started, triage_completed, evidence_collected, hypothesis_generated, status_changed, comment, agent_action]
        actor:
          type: string
          description: User name or agent name that produced this event
        data:
          type: object
        created_at:
          type: string
          format: date-time

    IncidentEvidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [log, metric, trace, snapshot, agent_output, manual]
        title:
          type: string
        content:
          type: object
        source:
          type: string
        collected_at:
          type: string
          format: date-time

    AlertSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incident_id:
          type: string
          format: uuid
        software_id:
          type: string
          format: uuid
        raw_payload:
          type: object
        normalized:
          $ref: '#/components/schemas/NormalizedAlert'
        snapshots:
          type: object
          description: System state snapshots captured after alert
        created_at:
          type: string
          format: date-time

    NormalizedAlert:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        source:
          type: string
          enum: [datadog, prometheus_alertmanager, grafana, otel, custom]
        service:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        started_at:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string

    # --- Pagination ---
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # --- Error ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object

    # --- SLO / Error Budget Tracking ---
    SLODefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        software_id:
          type: string
          format: uuid
        name:
          type: string
        slo_type:
          type: string
          enum: [availability, latency, error_rate]
        target_percentage:
          type: number
          format: double
          example: 99.9
        measurement_window_days:
          type: integer
          example: 30
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSLODefinitionRequest:
      type: object
      required: [software_id, name, slo_type, target_percentage]
      properties:
        software_id:
          type: string
          format: uuid
        name:
          type: string
        slo_type:
          type: string
          enum: [availability, latency, error_rate]
        target_percentage:
          type: number
          format: double
          example: 99.9
        measurement_window_days:
          type: integer
          default: 30

    UpdateSLODefinitionRequest:
      type: object
      properties:
        name:
          type: string
        slo_type:
          type: string
          enum: [availability, latency, error_rate]
        target_percentage:
          type: number
          format: double
        measurement_window_days:
          type: integer

    SLOStatus:
      type: object
      description: >
        Computed, point-in-time error-budget status for one SLO definition.
        See CalculateSLOStatus in backend/internal/services/slo_service.go
        for the exact formulas.
      properties:
        slo_definition_id:
          type: string
          format: uuid
        software_id:
          type: string
          format: uuid
        slo_type:
          type: string
          enum: [availability, latency, error_rate]
        target_percentage:
          type: number
          format: double
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        current_percentage:
          type: number
          format: double
        error_budget_total_minutes:
          type: number
          format: double
        error_budget_consumed_minutes:
          type: number
          format: double
        error_budget_remaining_percentage:
          type: number
          format: double
        status:
          type: string
          enum: [healthy, at_risk, exhausted]
        incident_count:
          type: integer
        is_approximated:
          type: boolean
          description: >
            True for slo_type=latency/error_rate, where there is no raw
            request/latency metrics ingestion in this codebase and the
            status is derived from incident-duration data as a proxy.

    # --- Data Retention & Archival ---
    RetentionPolicy:
      type: object
      description: >
        Per-org, per-resource-type retention configuration. Governs how long
        evidence, closed incidents, or agent runs are kept before a sweep
        archives or deletes them. Suggested (not hardcoded) starting points:
        evidence retention_days=90, incidents retention_days=365 -- every
        org configures its own values via this API.
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum: [evidence, incidents, agent_runs]
        retention_days:
          type: integer
          minimum: 1
          example: 90
        action:
          type: string
          enum: [archive, delete]
          description: >
            "archive" snapshots the row to archived_records before deleting
            it; "delete" hard-deletes with no snapshot.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRetentionPolicyRequest:
      type: object
      required: [resource_type, retention_days, action]
      properties:
        resource_type:
          type: string
          enum: [evidence, incidents, agent_runs]
        retention_days:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [archive, delete]
        enabled:
          type: boolean
          default: true

    UpdateRetentionPolicyRequest:
      type: object
      description: All fields optional; only provided fields are changed.
      properties:
        retention_days:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [archive, delete]
        enabled:
          type: boolean

    RetentionSweepResult:
      type: object
      properties:
        policy_id:
          type: string
          format: uuid
        resource_type:
          type: string
        action:
          type: string
        matched_count:
          type: integer
        archived_count:
          type: integer
        deleted_count:
          type: integer
        errors:
          type: array
          items:
            type: string

    RetentionSweepSummary:
      type: object
      properties:
        org_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/RetentionSweepResult'

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # --- Auth ---
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Software Catalog ---
  /software:
    get:
      tags: [Software Catalog]
      summary: List software entries
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/SoftwareEntry'
    post:
      tags: [Software Catalog]
      summary: Register software
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSoftwareRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareEntry'

  /software/{id}:
    get:
      tags: [Software Catalog]
      summary: Get software by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareEntry'
        '404':
          description: Not found
    put:
      tags: [Software Catalog]
      summary: Update software
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSoftwareRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoftwareEntry'
    delete:
      tags: [Software Catalog]
      summary: Delete software
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  # --- Agents ---
  /agents:
    get:
      tags: [Agent Registry]
      summary: List agents
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [triage, evidence_analysis, hypothesis, debug, custom]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Agent'
    post:
      tags: [Agent Registry]
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'

  /agents/{id}:
    get:
      tags: [Agent Registry]
      summary: Get agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    put:
      tags: [Agent Registry]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    delete:
      tags: [Agent Registry]
      summary: Delete agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  # --- Webhooks ---
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Webhook'
    post:
      tags: [Webhooks]
      summary: Create webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

  /webhooks/{id}:
    get:
      tags: [Webhooks]
      summary: Get webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
    delete:
      tags: [Webhooks]
      summary: Delete webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  # --- Webhook Ingestion (public, token-based) ---
  /ingest/{token}:
    post:
      tags: [Ingestion]
      summary: Receive alert via webhook
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Accepted
        '404':
          description: Unknown webhook token
        '422':
          description: Alert does not match any registered software

  # --- Bidirectional Slack/Teams notifications ---
  # Public webhooks (like /ingest/{token} above): called by Slack/Teams
  # themselves, not by an authenticated RootCauseway user. Authenticity is
  # established per-request instead of via JWT -- Slack's HMAC request
  # signature / a shared Teams verification token, both configured on the
  # notification_channels row that originally sent the interactive message
  # (see NotificationChannel.config additive keys: signing_secret for
  # slack, verification_token for teams).
  /webhooks/slack/interactive:
    post:
      tags: [Notifications]
      summary: Slack interactive component callback (Acknowledge / View RCA / Resolve)
      description: >
        Receives Slack's Block Kit `block_actions` payload (form-encoded,
        JSON in the `payload` field) when a user clicks a button on an
        incident notification message. Verifies X-Slack-Signature (HMAC-SHA256
        over `v0:{timestamp}:{body}` using the channel's signing_secret) and
        rejects requests whose timestamp is more than 5 minutes old, then
        dispatches the action and records it in notification_interactions.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON-encoded Slack interactive payload.
      parameters:
        - name: X-Slack-Request-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: X-Slack-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Action dispatched; body is a Slack message (ephemeral reply)
        '400':
          description: Malformed payload / action value
        '401':
          description: Invalid or stale signature
        '502':
          description: Action dispatch failed (e.g. incident not found)

  /webhooks/teams/interactive:
    post:
      tags: [Notifications]
      summary: Teams Adaptive Card Action.Submit callback (Acknowledge / View RCA / Resolve)
      description: >
        Receives a minimal Bot Framework-style activity forwarded when a
        user clicks an Action.Submit button on an Adaptive Card incident
        notification: {"type":"message","value":{"incident_id","channel_id","action"},"from":{...}}.
        Verified via a shared verification_token (Authorization: Bearer
        <token> or X-Teams-Verification-Token header) configured on the
        teams notification channel -- full Bot Framework JWT validation
        against Azure AD is out of scope.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Action dispatched; body is a simple text reply
        '400':
          description: Malformed activity / missing action value
        '401':
          description: Invalid or missing verification token
        '502':
          description: Action dispatch failed (e.g. incident not found)

  # --- Incidents ---
  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, mitigated, resolved, closed]
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: software_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/Incident'

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get incident with full timeline and evidence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
    patch:
      tags: [Incidents]
      summary: Update incident (status, assignee, root cause, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, investigating, mitigated, resolved, closed]
                severity:
                  type: string
                  enum: [critical, high, medium, low]
                assignee_id:
                  type: string
                  format: uuid
