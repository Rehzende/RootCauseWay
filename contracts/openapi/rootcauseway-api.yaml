      summary: Get the computed error-budget status for an SLO definition
      description: >
        Computes current attainment and error-budget burn over the
        definition's measurement window. For slo_type=availability this is
        derived from incident open-duration within the window. For
        slo_type=latency/error_rate, this codebase has no raw
        request/latency metrics ingestion, so the same incident-derived
        signal is used as a best-effort proxy -- the response is returned
        with is_approximated=true in that case.
      parameters:
