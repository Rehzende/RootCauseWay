---
apiVersion: v1
kind: Namespace
metadata:
  name: rootcauseway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rootcauseway-k8s-agent
  namespace: rootcauseway
---
# Read-only access to pods, logs, events, nodes, deployments, etc.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rootcauseway-k8s-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "nodes", "namespaces", "events", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rootcauseway-k8s-agent
subjects:
  - kind: ServiceAccount
    name: rootcauseway-k8s-agent
    namespace: rootcauseway
roleRef:
  kind: ClusterRole
  name: rootcauseway-k8s-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootcauseway-k8s-agent
  namespace: rootcauseway
  labels:
    app: rootcauseway-k8s-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rootcauseway-k8s-agent
  template:
    metadata:
      labels:
        app: rootcauseway-k8s-agent
    spec:
      serviceAccountName: rootcauseway-k8s-agent
      containers:
        - name: k8s-agent
          image: registry.rezende.lab/rootcauseway-k8s-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8094
              name: http
          env:
            - name: PORT
              value: "8094"
            - name: AGENT_URL
              value: "http://192.168.68.110:30094"
            # LLM — LM Studio running on the Mac mini (192.168.68.100),
            # reachable over the LAN. Falls back to OpenRouter creds from the
            # secret if set (e.g. to swap providers without editing this file).
            - name: OPENAI_API_BASE
              valueFrom:
                secretKeyRef:
                  name: rootcauseway-k8s-agent-config
                  key: llm_api_base
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rootcauseway-k8s-agent-config
                  key: llm_api_key
                  optional: true
            - name: LLM_MODEL
              value: "rootcauseway-analyst"
            # Observability — traces to Tempo, /metrics scraped by Prometheus
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "rootcauseway-k8s-agent"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rootcauseway-k8s-agent
  namespace: rootcauseway
  labels:
    app: rootcauseway-k8s-agent
spec:
  type: NodePort
  selector:
    app: rootcauseway-k8s-agent
  ports:
    - port: 8094
      targetPort: 8094
      nodePort: 30094
      name: http
---
# Optional: Secret for LLM config (create separately with real values)
# kubectl create secret generic rootcauseway-k8s-agent-config -n rootcauseway \
#   --from-literal=llm_api_key=sk-or-v1-... \
#   --from-literal=llm_api_base=https://openrouter.ai/api/v1
