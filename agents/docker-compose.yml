services:
  triage-agent:
    build: ./triage-agent
    ports:
      - "8090:8090"
    env_file:
      - ./triage-agent/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  evidence-agent:
    build: ./evidence-agent
    ports:
      - "8091:8091"
    env_file:
      - ./evidence-agent/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  rca-agent:
    build: ./rca-agent
    ports:
      - "8092:8092"
    env_file:
      - ./rca-agent/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postmortem-agent:
    build: ./postmortem-agent
    ports:
      - "8093:8093"
    env_file:
      - ./postmortem-agent/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 5s
      retries: 3
