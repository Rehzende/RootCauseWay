---
apiVersion: v1
kind: Namespace
metadata:
  name: rootcauseway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootcauseway-azure-agent
  namespace: rootcauseway
  labels:
    app: rootcauseway-azure-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rootcauseway-azure-agent
  template:
    metadata:
      labels:
        app: rootcauseway-azure-agent
    spec:
      containers:
        - name: azure-agent
          image: registry.rezende.lab/rootcauseway-azure-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8095
              name: http
          env:
            - name: PORT
              value: "8095"
            - name: AGENT_URL
              value: "http://192.168.68.110:30095"
            # Azure credential -- static for now (agents/azure-agent/app/
            # azure_clients.py checks task-level credentials.azure FIRST,
            # this env var set is the fallback used until the orchestrator
            # actually wires a JIT lease for this agent's resource type;
            # see project backlog "JIT credentials não são exercitadas").
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-agent-credentials
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-agent-credentials
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-agent-credentials
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  name: azure-agent-credentials
                  key: AZURE_SUBSCRIPTION_ID
            # Observability — traces to Tempo, /metrics scraped by Prometheus
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "rootcauseway-azure-agent"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rootcauseway-azure-agent
  namespace: rootcauseway
  labels:
    app: rootcauseway-azure-agent
spec:
  type: NodePort
  selector:
    app: rootcauseway-azure-agent
  ports:
    - port: 8095
      targetPort: 8095
      nodePort: 30095
      name: http
---
# Secret created out-of-band (contains the SP's client_secret), see
# scripts/azure-lab/provision-azure-agent-sp.sh:
# kubectl create secret generic azure-agent-credentials -n rootcauseway \
#   --from-literal=AZURE_TENANT_ID=... \
#   --from-literal=AZURE_CLIENT_ID=... \
#   --from-literal=AZURE_CLIENT_SECRET=... \
#   --from-literal=AZURE_SUBSCRIPTION_ID=...
