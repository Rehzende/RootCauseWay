limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- API reverse proxy ---
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # --- WebSocket reverse proxy (real-time incident/agent updates) ---
    # Found live: this block never existed, so useWebSocket's connection
    # (even after fixing its hardcoded localhost:8080 URL) had nowhere to
    # go in production -- the whole WS infra (backend/internal/ws/*) was
    # built and wired into the frontend but never actually reachable.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # WebSocket connections are long-lived by design -- the 60s read
        # timeout used for /api/ above would kill an idle-but-open
        # connection well before the client's own ping/pong keepalive
        # (backend/internal/ws/hub.go: pongWait=60s, pingPeriod=54s) has a
        # chance to refresh it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static assets with long cache ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA routing ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
