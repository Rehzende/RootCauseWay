apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-rootcauseway-webhook
  namespace: monitoring
  labels:
    release: prometheus
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: rootcauseway-webhook
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: rootcauseway-webhook
        webhook_configs:
          - url: 'http://host.docker.internal:8080/api/v1/ingest/WEBHOOK_TOKEN_PLACEHOLDER'
            send_resolved: true
            http_config:
              follow_redirects: true
