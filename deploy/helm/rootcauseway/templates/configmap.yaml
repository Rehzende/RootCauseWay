apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootcauseway.fullname" . }}-config
  labels:
    {{- include "rootcauseway.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.backend.port | quote }}
  DB_HOST: {{ include "rootcauseway.fullname" . }}-postgresql
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | quote }}
  REDIS_URL: "redis://{{ include "rootcauseway.fullname" . }}-redis-master:6379"
  BACKEND_API_URL: "http://{{ include "rootcauseway.fullname" . }}-backend:{{ .Values.backend.port }}/api/v1"
